[project]
name = "intelligent-face-tracker"
version = "0.1.0"
description = "Real-time face detection, recognition, tracking and unique visitor counting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3.0",
    "av>=12.0",
    "ultralytics>=8.4",
    "omegaconf>=2.3",
    "insightface>=2.1",
    "supervision==0.25.1",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.22,<2.0"]
gpu = ["onnxruntime-gpu==1.22.0"]
ui = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "streamlit>=1.36,<2.0",
    "pydantic>=2.7,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
