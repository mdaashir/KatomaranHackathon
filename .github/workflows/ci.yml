name: CI

# A PR merge runs this workflow twice by design: once for pull_request on the
# head commit (review gate) and once for push to main (merged-tree/direct-commit
# safety net). The dependency and Docker layers are cached between runs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.11
          uv sync --extra cpu --group dev --no-install-project

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

  typecheck:
    name: Typecheck (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.11
          uv sync --extra cpu --group dev --no-install-project

      - name: Mypy
        continue-on-error: true
        run: uv run --no-sync mypy src main.py scripts

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.11
          uv sync --extra cpu --group dev --no-install-project

      - name: Run tests with coverage
        run: |
          mkdir -p reports
          uv run --no-sync pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-fail-under=85 \
            --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore

  build:
    name: Build ${{ matrix.target }} image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [cpu, gpu]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          tags: intelligent-face-tracker:${{ matrix.target }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  e2e:
    name: E2E (file + RTSP)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CPU image
        run: |
          docker buildx build \
            --target cpu \
            --load \
            -t intelligent-face-tracker:cpu \
            --cache-from type=gha,scope=cpu \
            --cache-to type=gha,mode=max,scope=cpu \
            .

      - name: Run file and RTSP e2e
        run: bash tests/e2e/run_e2e.sh

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            data/e2e_*.db
            logs/e2e_file/
            logs/e2e_rtsp/
            reports/e2e/
          if-no-files-found: ignore
