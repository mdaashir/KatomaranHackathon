name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.target }} image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [cpu, gpu]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version tags
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tags<<EOF"
            echo "$IMAGE:v$VERSION-${{ matrix.target }}"
            echo "$IMAGE:${VERSION%.*}-${{ matrix.target }}"
            if [[ "$VERSION" != *-rc* ]]; then
              echo "$IMAGE:latest-${{ matrix.target }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: true
          sbom: true

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Zip sample outputs
        run: zip -r samples.zip samples

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: samples.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
